<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XQZ JSON Description Template</title>

  <link rel="stylesheet" href="css/xqz-description.css">
</head>
<body>

  <div id="xqz-description" class="xqz-description"></div>

  <script src="js/xqz-description.js"></script>
  <script>

    loadXQZFromJson({
      jsonUrl: "data/products.json",
      productId: "xqz",
      target: "#xqz-description"
    }).catch(error => {
      console.error(error);
      document.querySelector("#xqz-description").innerHTML =
        '<div class="xqz-empty">' + error.message + '</div>';
    });
  </script>
</body>
</html>
