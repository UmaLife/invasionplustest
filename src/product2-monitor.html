<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product</title>
<link rel="stylesheet" href="static/monitor-product.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<main class="product-page">
        <div class="product-navigation">
        <a id="prevProduct" class="product-nav prev" href="#">
            <i class="fa-solid fa-chevron-left"></i>
            <span>Previous Product</span>
        </a>

        <a id="nextProduct" class="product-nav next" href="#">
            <span>Next Product</span>
            <i class="fa-solid fa-chevron-right"></i>
        </a>
    </div>

    <section class="product-hero">
        <div class="thumb-panel">
            <button class="thumb-arrow" id="thumbUp">
                <i class="fa-solid fa-chevron-up"></i>
            </button>
            <div class="thumbs" id="thumbs"></div>
            <button class="thumb-arrow" id="thumbDown">
                <i class="fa-solid fa-chevron-down"></i>
            </button>
        </div>

        <div class="hero-image">
            <img id="mainImage" src="">
        </div>

        <div class="hero-info">
            <h1 id="productName"></h1>
            <h3 id="productPrice"></h3>

            <div class="info-row">
                <span>Variation</span>
                <div id="colorOptions" class="option-list"></div>
            </div>

            <div class="info-row">
                <span>Product Type</span>
                    <div class="option-list">
                        <div class="option-box" id="productType"></div>
                    </div>
            </div>

            <p class="desc" id="productDesc"></p>
        </div>
    </section>

    <section class="selling-points" id="sellingPoints"></section>

    <section class="feature-section">

        <div class="feature-header">
            <span>Next-Level Performance</span>
            <h2>Made For Gamers</h2>
            <p>Every detail designed to give you the competitive edge.</p>
        </div>

        <div class="feature-grid" id="featureGrid"></div>
        <p class="disclaimer">*Please note that the images shown are for illustrative purposes only and may not represent the exact color or finish of the product.</p>

    </section>

    <div id="xqz-description" class="xqz-description"></div>
    <section class="spec-section">
        <div class="spec-image">
            <img id="specImage" src="">
        </div>

        <div class="spec-table" id="specTable"></div>
    </section>


</main>
<script src="set.js"></script>
<script>
const urlParams = new URLSearchParams(window.location.search);
const productId = urlParams.get("id") || "genesis";

let currentProduct;
let currentImages = [];

const featureTargets = [
    "feature-panoramic",
    "feature-airflow",
    "feature-magnetic",
    "feature-compatibility",
    "feature-cooling"
];
fetch("products.json")
.then(res => res.json())
.then(data => {

    currentProduct = data.products.find(p => p.id === productId);
    setupProductNavigation(data.products);

    if(!currentProduct){
        document.body.innerHTML =
            "<h1 style='color:white'>Product not found</h1>";
        return;
    }

   renderProduct(currentProduct);

if (currentProduct.xqzDescription) {
    renderXQZDescription(currentProduct, "#xqz-description");
} else {
    document.getElementById("xqz-description").style.display = "none";
}

});

function getProductPage(product) {
    return product.category === "monitor"
        ? "product2-monitor.html"
        : "product2.html";
}

function setupProductNavigation(products) {
    const currentIndex =
        products.findIndex(product => product.id === productId);

    const prev =
        currentIndex > 0
            ? products[currentIndex - 1]
            : null;

    const next =
        currentIndex < products.length - 1
            ? products[currentIndex + 1]
            : null;

    const prevBtn =
        document.getElementById("prevProduct");

    const nextBtn =
        document.getElementById("nextProduct");

    if (prev) {
        prevBtn.href =
            `${getProductPage(prev)}?id=${prev.id}`;
    } else {
        prevBtn.classList.add("disabled");
    }

    if (next) {
        nextBtn.href =
            `${getProductPage(next)}?id=${next.id}`;
    } else {
        nextBtn.classList.add("disabled");
    }
}

function renderProduct(product){
    document.title = product.name;

    document.getElementById("productName").textContent = product.name;
    document.getElementById("productPrice").textContent = product.price || "";
    document.getElementById("productType").textContent = product["product-type"] || "";
    document.getElementById("productDesc").textContent = product.description || "";
    document.getElementById("specImage").src = product.specImage || product.mainImage;

    setupImages(product);
    renderColors(product);
    renderSellingPoints(product);
    renderFeatureGrid(product);
    renderFanBanners(product);
    renderSpecs(product);
}

function setupImages(product){
    if(product.variations){
        const firstColor = Object.keys(product.variations)[0];
        currentImages = product.variations[firstColor];
    }else{
        currentImages = product.images || [product.mainImage];
    }

    document.getElementById("mainImage").src = currentImages[0];
    renderThumbs();
    initThumbArrows();
}

function renderThumbs(){
    const thumbs = document.getElementById("thumbs");
    thumbs.innerHTML = "";

    currentImages.forEach((img, index) => {
        const thumb = document.createElement("img");
        thumb.src = img;

        if(index === 0) thumb.classList.add("active");

        thumb.onclick = () => {
            document.getElementById("mainImage").src = img;

            document.querySelectorAll(".thumbs img")
            .forEach(t => t.classList.remove("active"));

            thumb.classList.add("active");
        };

        thumbs.appendChild(thumb);
    });
}

function initThumbArrows(){
    const thumbs = document.getElementById("thumbs");
    const up = document.getElementById("thumbUp");
    const down = document.getElementById("thumbDown");

    if(!thumbs || !up || !down) return;

    up.onclick = () => {
        thumbs.scrollBy({
            top: -140,
            behavior: "smooth"
        });
    };

    down.onclick = () => {
        thumbs.scrollBy({
            top: 140,
            behavior: "smooth"
        });
    };
}

function renderColors(product) {
    const box = document.getElementById("colorOptions");
    box.innerHTML = "";

    // Products such as E-20 have no variations object
   if (!product.variations) {

    const option = document.createElement("button");
    option.type = "button";
    option.className = "variation-option";
    option.textContent = "Black";

    box.appendChild(option);

    return;
}

    Object.keys(product.variations).forEach((color, index) => {

        const option = document.createElement("button");
        option.type = "button";
        option.className = "variation-option";

        option.textContent =
            color.toLowerCase() === "lcd"
                ? "LCD"
                : color.charAt(0).toUpperCase() +
                  color.slice(1).toLowerCase();

        option.onclick = () => {

            document.querySelectorAll(".variation-option")
                .forEach(item =>
                    item.classList.remove("active")
                );

            option.classList.add("active");

            currentImages = product.variations[color];

            document.getElementById("mainImage").src =
                currentImages[0];

            renderThumbs();
        };

        box.appendChild(option);
    });
}

function renderSellingPoints(product){
    const box = document.getElementById("sellingPoints");
    box.innerHTML = "";

    if(!product.sellingPoints){
        box.style.display = "none";
        return;
    }

    box.style.display = "grid";
    box.style.gridTemplateColumns =
    `repeat(${product.sellingPoints.length}, 1fr)`;

    product.sellingPoints.forEach((item,index)=>{

    box.innerHTML += `
        <div class="point"
             data-target="feature-${index}">
            <i class="${item.icon}"></i>
            <h4>${item.title}</h4>
        </div>
    `;

});

    initSellingPointJump();
}

function initSellingPointJump(){
    document.querySelectorAll(".point").forEach(point => {
        point.addEventListener("click", () => {
            const targetId = point.dataset.target;
            const target = document.getElementById(targetId);

            if(!target) return;

            target.scrollIntoView({
                behavior: "smooth",
                block: "center"
            });

            document.querySelectorAll(".feature-box")
            .forEach(box => box.classList.remove("active-feature"));

            target.classList.add("active-feature");

            setTimeout(() => {
                target.classList.remove("active-feature");
            }, 1800);
        });
    });
}

function renderFeatureGrid(product){

    const section = document.querySelector(".feature-section");
    const grid = document.getElementById("featureGrid");

    grid.innerHTML = "";

    if(!product.productFeatureGrid?.cards){
        section.style.display = "none";
        return;
    }

    section.style.display = "block";

    product.productFeatureGrid.cards.forEach((card,index)=>{

        const icon =
            product.sellingPoints?.[index]?.icon ||
            "fa-solid fa-star";

        const cardClass =
            index === 4
                ? "feature-card feature-wide"
                : "feature-card";

        grid.innerHTML += `
            <article class="${cardClass}" id="feature-${index}">

            <div class="feature-top">

                <div class="feature-icon">
                    <i class="${icon}"></i>
                </div>

                <div class="feature-info">

                    <h3>${card.title}</h3>

                    ${
                        card.subtitle
                        ? `<span>${card.subtitle}</span>`
                        : ""
                    }

                    <p>${card.description}</p>

                </div>

            </div>

            <div class="feature-image">
                <img src="${card.image}" alt="${card.title}">
            </div>

        </article>

        `;

    });

}

function featureBox(card, size, id){
    if(!card) return "";

    return `
        <div class="feature-box ${size}" id="${id}">
            <div class="feature-content">
                ${size === "wide" ? `<h2>${card.title}</h2>` : `<h3>${card.title}</h3>`}
                ${card.subtitle ? `<span>${card.subtitle}</span>` : ""}
                <p>${card.description}</p>
            </div>

            <img src="${card.image}" alt="${card.title}">
        </div>
    `;
}
function renderFanBanners(product){

    const section =
        document.getElementById("fanBannerSection");

    const container =
        document.getElementById("fanBannerGrid");


    if(!section || !container){
        return;
    }


    container.innerHTML = "";


    const fanData =
        product.fanFeatureBanners;


    if(!fanData){
        section.style.display = "none";
        return;
    }


    section.style.display = "block";


    let hero = null;
    let features = [];


    /* New object structure */

    if(!Array.isArray(fanData)){

        hero =
            fanData.hero || null;

        features =
            fanData.features ||
            fanData.showcase?.cards ||
            [];

    }


    /* Old array structure support */

    else{

        hero =
            fanData[0] || null;

        features =
            fanData.slice(1);

    }


    if(!hero && features.length === 0){
        section.style.display = "none";
        return;
    }


    /* =====================================
       HERO
    ===================================== */

    if(hero){

        const heroBanner =
            document.createElement("article");

        heroBanner.className =
            "fan-hero-banner";

        heroBanner.innerHTML = `

            <div class="fan-hero-image fan-reveal-image">

                <img
                    src="${hero.image || ""}"
                    alt="${hero.title || "Fan feature"}"
                >

            </div>


            <div class="fan-hero-text fan-reveal-text">

                ${
                    hero.subtitle
                    ? `
                        <span class="fan-hero-eyebrow">
                            ${hero.subtitle}
                        </span>
                    `
                    : ""
                }

                ${
                    hero.title
                    ? `
                        <h2 class="fan-hero-title">
                            ${hero.title}
                        </h2>
                    `
                    : ""
                }

                ${
                    hero.description
                    ? `
                        <p class="fan-hero-description">
                            ${hero.description}
                        </p>
                    `
                    : ""
                }

            </div>

        `;


        container.appendChild(heroBanner);

    }


    /* =====================================
       FEATURE BOXES
    ===================================== */

    if(features.length > 0){

        const list =
            document.createElement("div");

        list.className =
            "fan-alternating-list";


        features.forEach((item,index)=>{

            const feature =
                document.createElement("article");

            feature.className =
                "fan-alternating-item";

            feature.dataset.featureIndex =
                index;


            feature.innerHTML = `

                <div class="fan-alternating-image fan-reveal-image">

                    <img
                        src="${item.image || ""}"
                        alt="${item.title || "Fan feature"}"
                        loading="lazy"
                    >

                </div>


                <div class="fan-alternating-text fan-reveal-text">

                    ${
                        item.subtitle
                        ? `
                            <p class="fan-alternating-subtitle">
                                ${item.subtitle}
                            </p>
                        `
                        : ""
                    }

                    ${
                        item.title
                        ? `
                            <h2 class="fan-alternating-title">
                                ${item.title}
                            </h2>
                        `
                        : ""
                    }

                    ${
                        item.description
                        ? `
                            <p class="fan-alternating-description">
                                ${item.description}
                            </p>
                        `
                        : ""
                    }

                </div>

            `;


            list.appendChild(feature);

        });


        container.appendChild(list);

    }


    requestAnimationFrame(()=>{
        initFanRevealAnimation();
    });

}

function initFanRevealAnimation(){

    const elements =
        document.querySelectorAll(
            "#fanBannerSection .fan-reveal-text, " +
            "#fanBannerSection .fan-reveal-image"
        );


    if(elements.length === 0){
        return;
    }


    if(!("IntersectionObserver" in window)){

        elements.forEach(element=>{
            element.classList.add("is-visible");
        });

        return;
    }


    const observer =
        new IntersectionObserver(

            entries=>{

                entries.forEach(entry=>{

                    if(entry.isIntersecting){

                        entry.target.classList.add(
                            "is-visible"
                        );

                        observer.unobserve(
                            entry.target
                        );

                    }

                });

            },

            {
                threshold:0.12,
                rootMargin:"0px 0px -30px 0px"
            }

        );


    elements.forEach(element=>{
        observer.observe(element);
    });

}

function renderSpecs(product){
    const table = document.getElementById("specTable");
    table.innerHTML = "";

    Object.entries(product.specs || {}).forEach(([key, value]) => {
        table.innerHTML += `
            <div class="spec-row">
                <div class="spec-key">${key}</div>
                <div class="spec-value">${value}</div>
            </div>
        `;
    });
}
</script>
</body>
</html>
