<script>
let productScrollFeatureData = [];
let currentScrollFeatureIndex = 0;
let scrollFeatureChanging = false;


function enableFeatureClick() {

    const card = document.querySelector(".product-card5");
    const features = document.querySelectorAll(".feature5");

    let currentIndex = 0;

    /* START WITH ALL BRIGHT */

    features.forEach(feature => {
        feature.style.opacity = "1";
        feature.style.filter = "brightness(1)";
    });

    function showFeature(index) {

        features.forEach((feature, i) => {

            feature.classList.remove("active-feature");

            if (i === index) {

                feature.classList.add("active-feature");

                feature.style.opacity = "1";
                feature.style.filter = "brightness(1.4)";

            } else {

                feature.style.opacity = "0.35";
                feature.style.filter = "brightness(0.45)";
            }

        });

    }

    /* AFTER 4 SECONDS START FOCUS MODE */

    setTimeout(() => {

        card.classList.add("focus-mode");

        showFeature(currentIndex);

        /* AUTO SWITCH */

        setInterval(() => {

            currentIndex++;

            if (currentIndex >= features.length) {
                currentIndex = 0;
            }

            showFeature(currentIndex);

        }, 8000);

    }, 4000);

    /* USER CLICK */

    features.forEach((feature, index) => {

        feature.addEventListener("click", () => {

            card.classList.add("focus-mode");

            currentIndex = index;

            showFeature(currentIndex);

        });

    });

    /* CLICK OUTSIDE RESET */

    document.addEventListener("click", (e) => {

        const clickedFeature = e.target.closest(".feature5");
        const clickedCard = e.target.closest(".product-card5");

            if (!clickedFeature && !clickedCard) {

        features.forEach(feature => {

            feature.classList.remove("active-feature");

            feature.style.opacity = "1";
            feature.style.filter = "brightness(1)";
        });

        /* IMAGE BRIGHT AGAIN */

        card.classList.remove("focus-mode");

    }

    });

}

function loadLifestyleSection(product) {

    if (!product.lifestyleSection) return;

    const data = product.lifestyleSection;

    const container = document.getElementById("lifestyle-grid");

    container.innerHTML = `
    
        <div class="lifestyle-card lifestyle-large">
            <img src="${data.leftImage}" alt="">
        </div>

        <div class="lifestyle-card lifestyle-large">
            <img src="${data.middleImage}" alt="">
        </div>

        <div class="lifestyle-content">

            <div>
                <h2>${data.title}</h2>
                <p>${data.description}</p>
            </div>

            <div class="lifestyle-small-images">
                <img src="${data.bottomImage1}" alt="">
                <img src="${data.bottomImage2}" alt="">
            </div>

        </div>
    `;
}

function loadFeatureGallery(product) {
    if (!product.featureGallery) return;

    const gallery = product.featureGallery;
    const container = document.getElementById("feature-gallery");

    container.innerHTML = `
        <div class="feature-gallery-hero">
            <img src="${gallery.heroImage}" alt="">
        </div>

        <div class="feature-gallery-cards">
            ${gallery.cards.map(card => `
                <div class="feature-gallery-card">
                    <img src="${card.image}" alt="">
                    <h3>${card.title}</h3>
                    <p>${card.description}</p>
                </div>
            `).join("")}
        </div>
    `;
}

/* ================= SCROLL ANIMATION ================= */

const gallerySection = document.querySelector(".feature-gallery-section");

const observer = new IntersectionObserver((entries) => {

    entries.forEach(entry => {

        if (entry.isIntersecting) {

            gallerySection.classList.add("show");

        }

    });

}, {
    threshold: 0.25
});

observer.observe(gallerySection);

async function loadProduct() {
    const params = new URLSearchParams(window.location.search);
    const productId = (params.get("id") || "e20").toLowerCase();

    const response = await fetch("products.json");
    const data = await response.json();

    const product = data.products.find(item =>
    item.id.toLowerCase() === productId);

    document.querySelectorAll(".section6-variation").forEach(btn => {
    const color = btn.dataset.color;

    // If product has variations, only show available colors
    if (product.variations) {
        btn.style.display = product.variations[color] ? "block" : "none";
    } 
    
    // If product has no variations, only show black/default
    else {
        btn.style.display = color === "black" ? "block" : "none";
    }
});

    if (!product) {
        alert("Product not found");
        return;
    }
    

    applyProductSections(product);

    document.title = product.name + " Product Page";

    document.getElementById("product-name").textContent = product.name;
    document.getElementById("product-price").textContent = product.price;
    const fansRow = document.querySelector(".section6-fans");
    const fansText = document.getElementById("product-fans");

    if (product.fans) {
        fansText.textContent = product.fans;
        fansRow.style.display = "block";
    } else {
        fansRow.style.display = "none";
    }

    document.getElementById("product-description").textContent = product.description;

    const mainImage = document.getElementById("main-image");
    mainImage.src = product.mainImage;
    mainImage.classList.add("img-animate");

    document.getElementById("hero-image").src = product.heroImage;
    document.getElementById("description-image").src = product.descriptionImage;
    const specImg = document.getElementById("spec-image");

        if (product.specImage) {
            specImg.src = product.specImage;
            specImg.style.display = "block";
        } else {
            specImg.style.display = "none";
        }

    document.getElementById("titleS2").textContent = product.heroTitle;
    document.getElementById("hero-description").textContent = product.heroDescription;

    if (product.customSection) {
    document.getElementById("custom-title").textContent = product.customSection.title;
    document.getElementById("custom-description").textContent = product.customSection.description;
}
if(product.videoShowcase){

    const video = document.getElementById("video-showcase-video");

    if(video){
        video.src = product.videoShowcase.video;
    }
}

if(product.imageShowcase){

    const grid = document.getElementById("image-showcase-grid");

    if(grid){
        grid.innerHTML = "";

        product.imageShowcase.slice(0, 4).forEach((image, index) => {

            const card = document.createElement("div");
            card.className = "image-showcase-card";
            card.style.animationDelay = `${index * 0.4}s`;
            card.style.transitionDelay = `${index * 0.15}s`;

            card.innerHTML = `
                <img src="${image}" alt="Product Image">
            `;

            grid.appendChild(card);
        });

        const imageCards = document.querySelectorAll(".image-showcase-card");

        const imageObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if(entry.isIntersecting){
                    entry.target.classList.add("show");
                }
            });
        }, {
            threshold:0.25
        });

        imageCards.forEach(card => {
            imageObserver.observe(card);
        });
    }
}
    /* VIDEODESC */

   /* VIDEODESC */

if(product.videodesc){

    const video = document.getElementById("videodesc-video");
    const brand = document.getElementById("videodesc-brand");
    const title = document.getElementById("videodesc-title");
    const subtitle = document.getElementById("videodesc-subtitle");

    video.src = product.videodesc.video;
    brand.textContent = product.videodesc.brand;
    subtitle.textContent = product.videodesc.subtitle;

    title.textContent = "";

    const videodescSection = document.querySelector(".videodesc-section");

    let typedStarted = false;

    function typeText(text, element, speed = 120){
        let index = 0;
        element.textContent = "";

        const typing = setInterval(() => {
            element.textContent += text.charAt(index);
            index++;

            if(index >= text.length){
                clearInterval(typing);
            }
        }, speed);
    }

    const videoDescObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if(entry.isIntersecting && !typedStarted){

                typedStarted = true;

                videodescSection.classList.add("show");

                setTimeout(() => {
                    typeText(product.videodesc.title, title, 130);
                }, 500);
            }
        });
    }, {
        threshold: 0.45
    });

    videoDescObserver.observe(videodescSection);
}

    loadThumbnails(product);
    loadFeatures(product);
    enableFeatureClick();
    loadSpecs(product);
    if (product.sections?.lifestyle !== false) {
    loadLifestyleSection(product);
    }
    if (product.sections?.featureGallery !== false) {
    loadFeatureGallery(product);
    }
    loadVerticalFeatures(product);
    loadScrollFeatures(product);
    updateDescriptionScroll();
}
function loadVerticalFeatures(product){

    const container = document.getElementById("characterStyleSection");

    if(!container) return;

    const items = product.verticalFeatures || [];

    if(items.length === 0) return;

    let currentIndex = 0;
    let autoTimer;

    function render(index){

        const item = items[index];

        container.innerHTML = `
        
            <div class="
                character-card
                intro-animation
                ${index === 0 ? "first-page" : ""}
            ">

                <div class="character-left">

                    <span class="character-side-text">
                        KRATOS
                    </span>

                    <div class="image-reveal">

                        <img 
                            src="${item.image}" 
                            class="character-main-image"
                        >

                    </div>

                </div>

                <div class="character-right">

                    <div class="content-reveal">

                        <span class="character-step">
                            0${index + 1} / 0${items.length}
                        </span>

                        <h1>${item.title}</h1>

                        <h3>
                            ${item.subtitle || "Product Feature"}
                        </h3>

                        <p>${item.description}</p>

                    </div>

                    <div class="character-thumbnails">

                        ${items.map((thumb, i)=>`
                        
                            <div class="
                                character-thumb
                                ${i === index ? "active" : ""}
                            " data-index="${i}">
                            
                                <img src="${thumb.image}">
                            
                            </div>
                        
                        `).join("")}

                    </div>

                </div>

            </div>
        
        `;

        document.querySelectorAll(".character-thumb")
        .forEach(thumb=>{

            thumb.addEventListener("click",()=>{

                currentIndex = Number(thumb.dataset.index);

                render(currentIndex);

                stopAuto();

            });

        });

    }

    function nextSlide(){

        currentIndex++;

        if(currentIndex >= items.length){
            currentIndex = 0;
        }

        render(currentIndex);

    }

    function restartAuto(){

        clearInterval(autoTimer);

        autoTimer = setInterval(()=>{
            nextSlide();
        }, 5000);

    }

    function stopAuto(){

        clearInterval(autoTimer);

    }

    render(currentIndex);

    restartAuto();
}

function applyProductSections(product) {

    const sections = product.sections || {};

    const sectionMap = {
    hero: document.querySelector(".section-2"),
    lifestyle: document.querySelector(".lifestyle-section"),
    description: document.querySelector(".product-section5"),
    highlight: document.querySelector(".product-description-scroll"),
    specs: document.querySelector(".section4"),
    featureGallery: document.querySelector(".feature-gallery-section"),
    custom: document.querySelector(".custom-section"),
    verticalFeatures: document.querySelector(".character-style-section"),
    videodesc: document.querySelector(".videodesc-section"),
    imageShowcase: document.querySelector(".image-showcase-section"),
    videoShowcase: document.querySelector(".video-hero-section")
        };

    Object.keys(sectionMap).forEach(key => {

        const section = sectionMap[key];

        if (!section) return;

        if (sections[key] === false) {

            section.style.display = "none";

            section.style.visibility = "hidden";

            section.style.height = "0";

            section.style.overflow = "hidden";

        } else {

            section.style.display = "";

            section.style.visibility = "";

            section.style.height = "";

            section.style.overflow = "";
        }

    });

}

function loadThumbnails(product, color = "black") {
    const thumbnailContainer = document.getElementById("thumbnail-container");
    thumbnailContainer.innerHTML = "";

    let images;

    if (product.variations && product.variations[color]) {
        images = product.variations[color];
    } else {
        images = product.images;
    }

    if (!images || images.length === 0) return;

    images.forEach((image, index) => {
        const img = document.createElement("img");

        img.src = image;
        img.className = "section6-thumb";

        if (index === 0) {
            img.classList.add("active");
        }

        img.addEventListener("click", function () {
            const mainImage = document.getElementById("main-image");

            mainImage.classList.remove("img-animate");
            void mainImage.offsetWidth;

            mainImage.src = image;
            mainImage.classList.add("img-animate");

            document.querySelectorAll(".section6-thumb").forEach(thumb => {
                thumb.classList.remove("active");
            });

            img.classList.add("active");
        });

        thumbnailContainer.appendChild(img);
    });

    document.getElementById("main-image").src = images[0];

    const variations = document.querySelectorAll(".section6-variation");

    if (product.variations) {

    variations.forEach(btn => {

        const color = btn.dataset.color;

        /* HIDE IF PRODUCT DOESN'T HAVE THIS VARIATION */

        if (!product.variations[color]) {
            btn.style.display = "none";
            return;
        }

        btn.style.display = "block";

        btn.addEventListener("click", function () {

            const images = product.variations[color];
            const mainImage = document.getElementById("main-image");

            variations.forEach(v => v.classList.remove("active"));
            btn.classList.add("active");

            loadThumbnails(product, color);

            mainImage.classList.remove("img-animate");
            void mainImage.offsetWidth;

            mainImage.src = images[0];
            mainImage.classList.add("img-animate");
        });
    });

}
}

function loadFeatures(product) {
    if (!product.features) return;

    product.features.forEach((feature, index) => {
        const number = index + 1;

        const titleElement = document.getElementById(`feature-title-${number}`);
        const descElement = document.getElementById(`feature-desc-${number}`);

        if (titleElement && descElement) {
            titleElement.textContent = feature.title;
            descElement.textContent = feature.description;
        }
    });
}

function loadSpecs(product) {

    // FIRST SPECS
    const specContent = document.getElementById("spec-content");
    specContent.innerHTML = "";

    for (const [title, value] of Object.entries(product.specs)) {

        const row = document.createElement("div");
        row.className = "spec-row";

        row.innerHTML = `
            <span class="spec-title">${title}</span>
            <span class="spec-value">${value}</span>
        `;

        specContent.appendChild(row);
    }

    // SECOND SPECS SECTION
    const specSection2 = document.getElementById("spec-section-2");
    const specContent2 = document.getElementById("spec-content-2");

    // IF PRODUCT HAS specs2
    if (product.specs2) {

        document.getElementById("spec-title-2").textContent =
    "| " + (product.specTitle2 || "Specification");
    
        specSection2.style.display = "block";

        specContent2.innerHTML = "";

        for (const [title, value] of Object.entries(product.specs2)) {

            const row = document.createElement("div");
            row.className = "spec-row";

            row.innerHTML = `
                <span class="spec-title">${title}</span>
                <span class="spec-value">${value}</span>
            `;

            specContent2.appendChild(row);
        }

        document.getElementById("spec-image-2").src =
            product.specImage2 || product.specImage;

    }

    else {

        specSection2.style.display = "none";
    }
}

function loadScrollFeatures(product) {
    const scrollImages =
        product.highlightImages ||
        product.variations?.black ||
        Object.values(product.variations || {})[0] ||
        [];

    const slidesContainer = document.getElementById("highlight-slides");
    slidesContainer.innerHTML = "";

    product.features.forEach((feature, index) => {
        const slide = document.createElement("div");
        slide.className = "highlight-slide";

        if (index === 0) {
            slide.classList.add("active");
        }

        slide.innerHTML = `
            <div class="description-left">
                <h1 class="highlight-title">${feature.title}</h1>
                <p>${feature.description}</p>
            </div>

            <div class="description-right">
                <img src="${scrollImages[index] || product.descriptionImage}" alt="Product Feature">
            </div>
        `;

        slidesContainer.appendChild(slide);
    });
}

function updateDescriptionScroll() {
    const section = document.querySelector(".product-description-scroll");
    const sticky = document.querySelector(".description-sticky");
    const slides = document.querySelectorAll(".highlight-slide");

    if (!section || !sticky || slides.length === 0) return;

    const scrollTop =
        document.documentElement.scrollTop ||
        document.body.scrollTop ||
        window.pageYOffset ||
        0;

    const viewportHeight = window.innerHeight;
    const sectionStart = section.offsetTop;
    const sectionHeight = section.offsetHeight;
    const sectionEnd = sectionStart + sectionHeight - viewportHeight;
    const totalScrollable = sectionHeight - viewportHeight;

    let progress = (scrollTop - sectionStart) / totalScrollable;
    progress = Math.max(0, Math.min(progress, 1));

    sticky.classList.remove("is-fixed", "is-bottom");

    if (scrollTop >= sectionStart && scrollTop < sectionEnd) {
        sticky.classList.add("is-fixed");
    } else if (scrollTop >= sectionEnd) {
        sticky.classList.add("is-bottom");
    }

    const index = Math.min(
        slides.length - 1,
        Math.round(progress * (slides.length - 1))
    );

    slides.forEach((slide, i) => {
        slide.classList.toggle("active", i === index);
    });
}

window.addEventListener("scroll", () => {
    const scrollTop = window.scrollY;
    const vh = window.innerHeight;

    let progress = scrollTop / vh;
    let p = Math.max(0, Math.min(1, progress));

    const photo = document.getElementById("photo");
    const titleS2 = document.getElementById("titleS2");
    const description = document.getElementById("hero-description");

    if (photo) {
        photo.style.opacity = p;
        const scale = 0.35 + (p * 0.4);
        const slideEffect = (1 - p) * 450;
        const extraDown = p * -80;

        photo.style.transform = `translate(calc(117% + ${slideEffect}px), calc(-50% + ${extraDown}px)) scale(${scale})`;
    }

    if (titleS2) {
        titleS2.style.opacity = p;
        const drift = (1 - p) * 30;
        titleS2.style.transform = `translateY(${drift}px)`;
        titleS2.style.letterSpacing = `${0.1 + (p * 0.2)}em`;
    }

    if (description) {
        const descP = Math.max(0, (p - 0.2) / 0.8);
        description.style.opacity = descP;
        description.style.transform = `translateY(${(1 - descP) * 20}px)`;
    }

    updateDescriptionScroll();
});

loadProduct();
</script>
<script>
const lifestyleSection = document.querySelector('.lifestyle-section');

const lifestyleObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        if (entry.isIntersecting) {
            entry.target.classList.add('show');
        }
    });
}, {
    threshold: 0.2
});

lifestyleObserver.observe(lifestyleSection);
</script>
<script src="animatescroll.js"></script>

</body>
