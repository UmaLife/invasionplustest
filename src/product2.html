<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Product</title>
<link rel="stylesheet" href="static/style.css">
<link rel="stylesheet" href="static/css/xqz-description.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<main class="product-page monitor-product">
<div class="product-navigation">
    <a id="prevProduct" class="product-nav prev" href="#">
        <i class="fa-solid fa-chevron-left"></i>
        <span>Previous Product</span>
    </a>

    <a id="nextProduct" class="product-nav next" href="#">
        <span>Next Product</span>
        <i class="fa-solid fa-chevron-right"></i>
    </a>
</div>

<section class="product-hero">
    <div class="thumb-panel">
        <button class="thumb-arrow" id="thumbUp">
            <i class="fa-solid fa-chevron-up"></i>
        </button>
        <div class="thumbs" id="thumbs"></div>
        <button class="thumb-arrow" id="thumbDown">
            <i class="fa-solid fa-chevron-down"></i>
        </button>
    </div>

    <div class="hero-image" id="heroImageViewer">
        <img id="mainImage" src="" alt="Product Image">
    </div>

    <div class="hero-info">
        <h1 id="productName"></h1>
        <h3 id="productPrice"></h3>

       <div class="info-row">
    <span>Variation</span>
    <div id="colorOptions" class="option-list"></div>
</div>

<div class="info-row" id="fanRow">
    <span>Fan</span>
    <div id="fanOptions" class="option-list"></div>
</div>
<div class="info-row" id="productTypeRow">
    <span>Product Type</span>
    <div class="option-list">
        <div class="option-box" id="productType"></div>
    </div>
</div>


        <p class="desc" id="productDesc"></p>
    </div>
</section>

<section class="selling-points" id="sellingPoints"></section>

<section class="feature-section">
    <div class="feature-grid" id="featureGrid"></div>
    <p class="disclaimer">*Please note that the images shown are for illustrative purposes only and may not represent the exact color or finish of the product.</p>
</section>



<div id="xqz-description" class="xqz-description"></div>
    

<section class="spec-section">
    <div class="spec-image">
        <img id="specImage" src="">
    </div>

    <div class="spec-table" id="specTable"></div>
</section>


</main>
<script src="set.js"></script>
<script>
const urlParams = new URLSearchParams(window.location.search);
const productId = urlParams.get("id") || "genesis";

let currentProduct;
let currentImages = [];

const featureTargets = [
    "feature-panoramic",
    "feature-airflow",
    "feature-magnetic",
    "feature-compatibility",
    "feature-cooling"
];
fetch(`products.json?v=${Date.now()}`)
.then(res => res.json())
.then(data => {

    currentProduct = data.products.find(p => p.id === productId);
    setupProductNavigation(data.products);

    if(!currentProduct){
        document.body.innerHTML =
            "<h1 style='color:white'>Product not found</h1>";
        return;
    }

    if (currentProduct.category === "monitor") {
        window.location.replace(`product2-monitor.html?id=${currentProduct.id}`);
        return;
    }


   renderProduct(currentProduct);
   renderProductVideo(currentProduct);
   initHeroReveal();
   initSpecImageZoom();
   initHeroImageViewer();
   initSectionReveal();

if (currentProduct.xqzDescription) {
    renderXQZDescription(currentProduct, "#xqz-description");
} else {
    document.getElementById("xqz-description").style.display = "none";
}

});

function renderProduct(product){
    document.title = product.name;

    document.getElementById("productName").textContent =
        product.name;

    document.getElementById("productPrice").textContent =
        product.price || "";

    const productTypeRow = document.getElementById("productTypeRow");
const productTypeBox = document.getElementById("productType");

if (product["product-type"]) {
    productTypeRow.style.display = "";
    productTypeBox.textContent = product["product-type"];
} else {
    productTypeRow.style.display = "none";
}

   const fanRow = document.getElementById("fanRow");
const fanContainer = document.getElementById("fanOptions");

fanContainer.innerHTML = "";

if (!product.fans) {
    fanRow.style.display = "none";
} else {
    fanRow.style.display = "";

    product.fans.split("/").forEach(fan => {
        const box = document.createElement("div");
        box.className = "option-box";
        box.textContent = fan.trim();
        fanContainer.appendChild(box);
    });
}

    document.getElementById("productDesc").textContent =
        product.description || "";

    document.getElementById("specImage").src =
        product.specImage || product.mainImage;

    setupImages(product);
    renderColors(product);
    renderSellingPoints(product);
    renderFeatureGrid(product);
    renderFanBanners(product);
    renderSpecs(product);
}

function setupImages(product){

    if(product.variations){

        const firstColor =
            Object.keys(product.variations)[0];

        currentImages =
            product.variations[firstColor];

    }else{

        currentImages =
            product.images ||
            [product.mainImage];

    }

    currentImageIndex = 0;

    document.getElementById(
        "mainImage"
    ).src = currentImages[0];

    renderThumbs();
    initThumbArrows();
    initHeroAutoSlideObserver();
}

function renderThumbs(){
    const thumbs = document.getElementById("thumbs");
    thumbs.innerHTML = "";

    currentImages.forEach((img, index) => {
        const thumb = document.createElement("img");
        thumb.src = img;

        if(index === 0) thumb.classList.add("active");

        thumb.onclick = () => {
            changeMainImage(index);
            if (heroIsVisible) {
                stopAutoImageSlider();
                startAutoImageSlider();
            }
        };

        thumbs.appendChild(thumb);
    });
}

function initThumbArrows(){
    const thumbs = document.getElementById("thumbs");
    const up = document.getElementById("thumbUp");
    const down = document.getElementById("thumbDown");

    if(!thumbs || !up || !down) return;

    up.onclick = () => {
        thumbs.scrollBy({
            top: -140,
            behavior: "smooth"
        });
    };

    down.onclick = () => {
        thumbs.scrollBy({
            top: 140,
            behavior: "smooth"
        });
    };
}

/* =========================================
   AUTO MAIN IMAGE SLIDER
========================================= */
let autoSlideTimer = null;
let currentImageIndex = 0;
let heroIsVisible = false;


/* =========================================
   CHECK IF HERO IS VISIBLE
========================================= */

function initHeroAutoSlideObserver() {

    const hero =
        document.querySelector(".product-hero");

    if (!hero) return;

    const observer =
        new IntersectionObserver(
            entries => {

                entries.forEach(entry => {

                    heroIsVisible =
                        entry.isIntersecting;

                    if (heroIsVisible) {

                        startAutoImageSlider();

                    } else {

                        stopAutoImageSlider();

                    }

                });

            },
            {
                threshold: 0.2
            }
        );

    observer.observe(hero);
}


/* =========================================
   START AUTO SLIDER
========================================= */

function startAutoImageSlider() {

    if (autoSlideTimer) return;

    if (
        !currentImages ||
        currentImages.length <= 1
    ) {
        return;
    }

    autoSlideTimer =
        setInterval(() => {

            /*
             Only continue if Hero is visible
            */

            if (!heroIsVisible) {

                stopAutoImageSlider();

                return;

            }

            currentImageIndex++;

            if (
                currentImageIndex >=
                currentImages.length
            ) {

                currentImageIndex = 0;

            }

            changeMainImage(
                currentImageIndex
            );

        }, 3000);
}


/* =========================================
   STOP AUTO SLIDER
========================================= */

function stopAutoImageSlider() {

    if (autoSlideTimer) {

        clearInterval(
            autoSlideTimer
        );

        autoSlideTimer = null;

    }

}
/* =========================================
   CHANGE MAIN IMAGE
========================================= */

function changeMainImage(index) {

    if (!currentImages[index]) return;

    currentImageIndex = index;

    const mainImage =
        document.getElementById("mainImage");

    mainImage.style.opacity = "0";

    setTimeout(() => {

        mainImage.src =
            currentImages[index];

        mainImage.style.opacity = "1";

    }, 180);


    /* Update thumbnail active state */

    document
        .querySelectorAll(".thumbs img")
        .forEach((thumb, i) => {

            thumb.classList.toggle(
                "active",
                i === index
            );

        });


    /* Automatically scroll thumbnail into view */

    const activeThumb =
        document.querySelector(
            ".thumbs img.active"
        );

    if (heroIsVisible && activeThumb) {

        activeThumb.scrollIntoView({
            behavior: "smooth",
            block: "nearest"
        });

    }
}

function renderColors(product) {
    const box = document.getElementById("colorOptions");
    box.innerHTML = "";

    // Products such as E-20 have no variations object
   if (!product.variations) {

    const option = document.createElement("button");
    option.type = "button";
    option.className = "variation-option";
    option.textContent = "Black";

    box.appendChild(option);

    return;
}

    Object.keys(product.variations).forEach((color, index) => {

        const option = document.createElement("button");
        option.type = "button";
        option.className = "variation-option";

        option.textContent =
            color.toLowerCase() === "lcd"
                ? "LCD"
                : color.charAt(0).toUpperCase() +
                  color.slice(1).toLowerCase();

        option.onclick = () => {

            document.querySelectorAll(".variation-option")
                .forEach(item =>
                    item.classList.remove("active")
                );

            option.classList.add("active");

            currentImages = product.variations[color];

            document.getElementById("mainImage").src =
                currentImages[0];

            renderThumbs();
            initAutoImageSlider();
        };

        box.appendChild(option);
    });
}
function renderSellingPoints(product){
    const box = document.getElementById("sellingPoints");
    box.innerHTML = "";

    if(!product.sellingPoints){
        box.style.display = "none";
        return;
    }

    box.style.display = "grid";
    box.style.gridTemplateColumns =
    `repeat(${product.sellingPoints.length}, 1fr)`;

    product.sellingPoints.forEach((item,index)=>{

    box.innerHTML += `
        <div class="point"
             data-target="feature-${index}">
            <i class="${item.icon}"></i>
            <h4>${item.title}</h4>
        </div>
    `;

});

    initSellingPointJump();
}
function initSellingPointJump() {
    const points = document.querySelectorAll(".selling-points .point");

    points.forEach((point, index) => {
        point.style.cursor = "pointer";

        point.addEventListener("click", () => {
            let target;

            if (currentProduct && currentProduct.xqzDescription) {
                target = document.getElementById(
                    `xqz-feature-${index}`
                );
            } else {
                target = document.getElementById(
                    point.dataset.target
                );
            }

            if (!target) {
                console.warn(
                    `Feature xqz-feature-${index} was not found.`
                );
                return;
            }

            /* Remove active state from all top buttons */
            points.forEach(item => {
                item.classList.remove("active");
            });

            /* Remove neon from every feature card */
            document
                .querySelectorAll(
                    "#xqz-description .xqz-feature"
                )
                .forEach(feature => {
                    feature.classList.remove("active-neon");
                });

            /* Activate clicked button and matching card */
            point.classList.add("active");
            target.classList.add("active-neon");

            target.scrollIntoView({
                behavior: "smooth",
                block: "center"
            });
        });
    });
}

function renderFeatureGrid(product){

    const section = document.querySelector(".feature-section");
    const grid = document.getElementById("featureGrid");

    grid.innerHTML="";

    if(!product.productFeatureGrid?.cards){
        section.style.display="none";
        return;
    }

    section.style.display="block";

    const cards = product.productFeatureGrid.cards;

    let row = null;

    cards.forEach((card,index)=>{

        const isWide = card.type === "wide";

        if(isWide){

            if(row){
                grid.appendChild(row);
                row = null;
            }

            const wrapper=document.createElement("div");
            wrapper.innerHTML=featureBox(
                card,
                "wide",
                `feature-${index}`,
                index
            );

            grid.appendChild(wrapper.firstElementChild);

        }

        else{

            if(!row){
                row=document.createElement("div");
                row.className="feature-row";
            }

            const wrapper=document.createElement("div");
            wrapper.innerHTML=featureBox(
                card,
                "small",
                `feature-${index}`
            );

            row.appendChild(wrapper.firstElementChild);

            if(row.children.length===2){
                grid.appendChild(row);
                row=null;
            }

        }

    });

    if(row){
        grid.appendChild(row);
    }

    requestAnimationFrame(() => {
    initFeatureScrollInteraction();
    initFeatureMouseInteraction();
    initCoolingButtons();
});

}

function featureBox(card, size, id, index){

    if(!card) return "";

    const imageSide =
        index % 2 === 0
            ? "image-left"
            : "image-right";

    const hasCoolingButtons =
        card.airCoolingImage ||
        card.liquidCoolingImage;

    return `
        <div
            class="feature-box ${size} ${imageSide}"
            id="${id}"
        >

            <div class="feature-content">

                ${
                    size === "wide"
                        ? `<h2>${card.title}</h2>`
                        : `<h3>${card.title}</h3>`
                }

                ${
                    card.subtitle
                        ? `<span>${card.subtitle}</span>`
                        : ""
                }

                <p>${card.description}</p>

                ${
                    hasCoolingButtons
                        ? `
                            <div class="cooling-buttons">

                                ${
                                    card.airCoolingImage
                                        ? `
                                            <button
                                                type="button"
                                                class="cooling-btn"
                                                data-cooling-type="air"
                                                data-image="${card.airCoolingImage}"
                                            >
                                                AIR COOLING
                                            </button>
                                        `
                                        : ""
                                }

                                ${
                                    card.liquidCoolingImage
                                        ? `
                                            <button
                                                type="button"
                                                class="cooling-btn"
                                                data-cooling-type="liquid"
                                                data-image="${card.liquidCoolingImage}"
                                            >
                                                LIQUID COOLING
                                            </button>
                                        `
                                        : ""
                                }

                            </div>
                        `
                        : ""
                }

            </div>

            <img
                src="${card.image}"
                alt="${card.title}"
                class="feature-main-image"
            >

        </div>
    `;
}
function initCoolingButtons() {
    const coolingBoxes =
        document.querySelectorAll(".feature-box");
    coolingBoxes.forEach(box => {
        const buttons =
            box.querySelectorAll(".cooling-btn");
        if (!buttons.length) return;
        const image =
            box.querySelector(".feature-main-image");
        if (!image) return;
        buttons.forEach(button => {
            button.addEventListener("click", () => {
                const newImage =
                    button.dataset.image;
                if (!newImage) {
                    console.warn(
                        "Cooling image not found."
                    );
                    return;
                }

                buttons.forEach(btn => {
                    btn.classList.remove("active");
                });

                button.classList.add("active");

                image.classList.add("cooling-image-changing");

                setTimeout(() => {

                    image.src = newImage;

                    image.onload = () => {
                        image.classList.remove(
                            "cooling-image-changing"
                        );
                    };

                }, 180);

            });

        });

    });

}
function renderFanBanners(product){

    const section =
        document.getElementById("fanBannerSection");

    const container =
        document.getElementById("fanBannerGrid");


    if(!section || !container){
        return;
    }


    container.innerHTML = "";


    const fanData =
        product.fanFeatureBanners;


    if(!fanData){
        section.style.display = "none";
        return;
    }


    section.style.display = "block";


    let hero = null;
    let features = [];


    /* New object structure */

    if(!Array.isArray(fanData)){

        hero =
            fanData.hero || null;

        features =
            fanData.features ||
            fanData.showcase?.cards ||
            [];

    }


    /* Old array structure support */

    else{

        hero =
            fanData[0] || null;

        features =
            fanData.slice(1);

    }


    if(!hero && features.length === 0){
        section.style.display = "none";
        return;
    }


    /* =====================================
       HERO
    ===================================== */

    if(hero){

        const heroBanner =
            document.createElement("article");

        heroBanner.className =
            "fan-hero-banner";

        heroBanner.innerHTML = `

            <div class="fan-hero-image fan-reveal-image">

                <img
                    src="${hero.image || ""}"
                    alt="${hero.title || "Fan feature"}"
                >

            </div>


            <div class="fan-hero-text fan-reveal-text">

                ${
                    hero.subtitle
                    ? `
                        <span class="fan-hero-eyebrow">
                            ${hero.subtitle}
                        </span>
                    `
                    : ""
                }

                ${
                    hero.title
                    ? `
                        <h2 class="fan-hero-title">
                            ${hero.title}
                        </h2>
                    `
                    : ""
                }

                ${
                    hero.description
                    ? `
                        <p class="fan-hero-description">
                            ${hero.description}
                        </p>
                    `
                    : ""
                }

            </div>

        `;


        container.appendChild(heroBanner);

    }


    /* =====================================
       FEATURE BOXES
    ===================================== */

    if(features.length > 0){

        const list =
            document.createElement("div");

        list.className =
            "fan-alternating-list";


        features.forEach((item,index)=>{

            const feature =
                document.createElement("article");

            feature.className =
                "fan-alternating-item";

            feature.dataset.featureIndex =
                index;


            feature.innerHTML = `

                <div class="fan-alternating-image fan-reveal-image">

                    <img
                        src="${item.image || ""}"
                        alt="${item.title || "Fan feature"}"
                        loading="lazy"
                    >

                </div>


                <div class="fan-alternating-text fan-reveal-text">

                    ${
                        item.subtitle
                        ? `
                            <p class="fan-alternating-subtitle">
                                ${item.subtitle}
                            </p>
                        `
                        : ""
                    }

                    ${
                        item.title
                        ? `
                            <h2 class="fan-alternating-title">
                                ${item.title}
                            </h2>
                        `
                        : ""
                    }

                    ${
                        item.description
                        ? `
                            <p class="fan-alternating-description">
                                ${item.description}
                            </p>
                        `
                        : ""
                    }

                </div>

            `;


            list.appendChild(feature);

        });


        container.appendChild(list);

    }


    requestAnimationFrame(()=>{
        initFanRevealAnimation();
    });

}
function setupProductNavigation(products){

    const currentIndex = products.findIndex(p => p.id === productId);

    const prev = currentIndex > 0
        ? products[currentIndex - 1]
        : null;

    const next = currentIndex < products.length - 1
        ? products[currentIndex + 1]
        : null;

    const prevBtn = document.getElementById("prevProduct");
    const nextBtn = document.getElementById("nextProduct");

    if (prev) {
        prevBtn.href = `product2.html?id=${prev.id}`;
    } else {
        prevBtn.classList.add("disabled");
    }

    if (next) {
        nextBtn.href = `product2.html?id=${next.id}`;
    } else {
        nextBtn.classList.add("disabled");
    }
}

function initFanRevealAnimation(){

    const elements =
        document.querySelectorAll(
            "#fanBannerSection .fan-reveal-text, " +
            "#fanBannerSection .fan-reveal-image"
        );


    if(elements.length === 0){
        return;
    }


    if(!("IntersectionObserver" in window)){

        elements.forEach(element=>{
            element.classList.add("is-visible");
        });

        return;
    }


    const observer =
        new IntersectionObserver(

            entries=>{

                entries.forEach(entry=>{

                    if(entry.isIntersecting){

                        entry.target.classList.add(
                            "is-visible"
                        );

                        observer.unobserve(
                            entry.target
                        );

                    }

                });

            },

            {
                threshold:0.12,
                rootMargin:"0px 0px -30px 0px"
            }

        );


    elements.forEach(element=>{
        observer.observe(element);
    });

}

function renderSpecs(product) {
    const table = document.getElementById("specTable");
    table.innerHTML = "";

    function renderSpecGroup(title, specs) {
        if (!specs || Object.keys(specs).length === 0) return;

        if (title) {
            table.innerHTML += `
                <h2 class="spec-title">${title}</h2>
            `;
        }

        Object.entries(specs).forEach(([key, value]) => {
            table.innerHTML += `
                <div class="spec-row">
                    <div class="spec-key">${key}</div>
                    <div class="spec-value">${value}</div>
                </div>
            `;
        });
    }

    renderSpecGroup(product.specTitle, product.specs);
    renderSpecGroup(product.specTitle2, product.specs2);
}

function renderProductVideo(product) {

    const section =
        document.getElementById("productVideoSection");

    const video =
        document.getElementById("productVideo");

    const overlay =
        document.getElementById("videoPlayOverlay");

    const productName =
        document.getElementById("videoProductName");

    if (!section || !video) return;

    const videoData = product.video;

    /*
    ==========================================
    NO VIDEO
    ==========================================
    */

    if (!videoData) {
        section.style.display = "none";
        return;
    }

    /*
    ==========================================
    NORMALIZE VIDEO DATA
    ==========================================
    */

    let horizontal = videoData.horizontal || "";
    let vertical = videoData.vertical || "";

    /*
    If customer only provides one video,
    use the same video everywhere.
    */

    if (!horizontal && vertical) {
        horizontal = vertical;
    }

    if (!vertical && horizontal) {
        vertical = horizontal;
    }

    /*
    ==========================================
    CREATE VIDEO SOURCES
    ==========================================
    */

    video.innerHTML = "";

    /*
    Desktop source
    */

    const desktopSource =
        document.createElement("source");

    desktopSource.src = horizontal;

    desktopSource.media =
        "(min-width: 769px)";

    desktopSource.type =
        "video/mp4";

    video.appendChild(desktopSource);


    /*
    Mobile source
    */

    const mobileSource =
        document.createElement("source");

    mobileSource.src = vertical;

    mobileSource.media =
        "(max-width: 768px)";

    mobileSource.type =
        "video/mp4";

    video.appendChild(mobileSource);


    /*
    ==========================================
    DISPLAY
    ==========================================
    */

    section.style.display = "block";

    productName.textContent =
        product.name;

    video.load();


    /*
    ==========================================
    PLAY INTERACTION
    ==========================================
    */

    overlay.onclick = () => {

        if (video.paused) {

            video.play();

        } else {

            video.pause();

        }

    };


    video.addEventListener("play", () => {

        overlay.classList.add("playing");

    });


    video.addEventListener("pause", () => {

        overlay.classList.remove("playing");

    });


    /*
    ==========================================
    REVEAL ANIMATION
    ==========================================
    */

    requestAnimationFrame(() => {

        initProductVideoReveal();

    });

}

function initProductVideoReveal() {

    const frame =
        document.querySelector(".product-video-frame");

    if (!frame) return;

    if (!("IntersectionObserver" in window)) {

        frame.classList.add("is-visible");

        return;
    }

    const observer =
        new IntersectionObserver(
            entries => {

                entries.forEach(entry => {

                    if (entry.isIntersecting) {

                        frame.classList.add("is-visible");

                        observer.unobserve(frame);

                    }

                });

            },
            {
                threshold: .15
            }
        );

    observer.observe(frame);
}

function initFeatureScrollInteraction() {

    const features =
        document.querySelectorAll(".feature-box.wide");

    if (!features.length) return;

    const observer = new IntersectionObserver(
        entries => {

            entries.forEach(entry => {

                if (!entry.isIntersecting) return;

                entry.target.classList.add("is-active");

                // 只触发一次
                observer.unobserve(entry.target);
            });

        },
        {
            threshold: 0.25,
            rootMargin: "0px 0px -10% 0px"
        }
    );

    features.forEach(feature => {
        observer.observe(feature);
    });
}
function initFeatureMouseInteraction() {

    const features =
        document.querySelectorAll(".feature-box.wide");

    features.forEach(feature => {

        feature.addEventListener("mousemove", e => {

            const rect =
                feature.getBoundingClientRect();

            const x =
                e.clientX - rect.left;

            const y =
                e.clientY - rect.top;

            const centerX =
                rect.width / 2;

            const centerY =
                rect.height / 2;

            const rotateX =
                (y - centerY) / centerY * -2;

            const rotateY =
                (x - centerX) / centerX * 2;

            const moveX =
                (x - centerX) / centerX * 8;

            const moveY =
                (y - centerY) / centerY * 8;

            feature.style.setProperty(
                "--mouse-x",
                `${x}px`
            );

            feature.style.setProperty(
                "--mouse-y",
                `${y}px`
            );

            feature.style.transform =
            `rotateX(${rotateX}deg)
            rotateY(${rotateY}deg)
            scale(1.01)
    `       ;

            const image =
                feature.querySelector("img");

            if(image){

                image.style.transform =
                    `
                    translate(
                        ${moveX}px,
                        ${moveY}px
                    )
                    translateY(-50%)
                    scale(1.02)
                    `;
            }

        });

        feature.addEventListener("mouseleave", () => {

            feature.style.transform =
                "";

            const image =
                feature.querySelector("img");

            if(image){

                image.style.transform =
                    "translateY(-50%) scale(1)";
            }

        });

    });

}

function initSpecImageZoom() {

    const box = document.querySelector(".spec-image");
    const image = document.getElementById("specImage");

    if (!box || !image) {
        console.log("Spec image zoom: element not found");
        return;
    }

    console.log("Spec image zoom initialized");


    box.addEventListener("mouseenter", function () {

        box.classList.add("zoom-active");

    });


    box.addEventListener("mousemove", function (e) {

        const rect = box.getBoundingClientRect();

        const x =
            (e.clientX - rect.left) / rect.width;

        const y =
            (e.clientY - rect.top) / rect.height;


        /*
        Mouse position
        */

        const moveX =
            (0.5 - x) * 180;

        const moveY =
            (0.5 - y) * 180;


        image.style.transform =
            `translate(${moveX}px, ${moveY}px) scale(1.8)`;

    });


    box.addEventListener("mouseleave", function () {

        box.classList.remove("zoom-active");

        image.style.transform =
            "translate(0px, 0px) scale(1)";

    });

}

function initHeroImageViewer() {

    const hero =
        document.getElementById("heroImageViewer");

    const image =
        document.getElementById("mainImage");

    const modal =
        document.getElementById("imagePreviewModal");

    const previewImage =
        document.getElementById("previewImage");

    const closeButton =
        document.getElementById("imagePreviewClose");

    const zoomCursor =
        hero?.querySelector(".zoom-cursor");


    if (
        !hero ||
        !image ||
        !modal ||
        !previewImage
    ) {

        console.log(
            "Hero image viewer: element not found"
        );

        return;
    }


    /* =========================================
       MAGNIFY CURSOR
    ========================================= */

    hero.addEventListener("mousemove", function(e) {

        if (!zoomCursor) return;

        const rect =
            hero.getBoundingClientRect();

        const x =
            e.clientX - rect.left;

        const y =
            e.clientY - rect.top;

        zoomCursor.style.left = `${x}px`;
        zoomCursor.style.top = `${y}px`;

    });


    /* =========================================
       OPEN PREVIEW
    ========================================= */

    image.addEventListener("click", function() {

        if (!image.src) return;
        previewImage.onload = () => {
            resetPreviewView();
        };

        previewImage.src = image.src;

        modal.classList.add("active");

        document.body.style.overflow = "hidden";

    });


    /* =========================================
       CLOSE
    ========================================= */

    function closePreview() {

        modal.classList.remove("active");

        document.body.style.overflow = "";

        resetPreviewView();
    }


    if (closeButton) {

        closeButton.addEventListener(
            "click",
            function(e) {

                e.stopPropagation();

                closePreview();

            }
        );

    }


    /* =========================================
       CLICK BACKGROUND TO CLOSE
    ========================================= */

    modal.addEventListener(
        "click",
        function(e) {

            if (e.target === modal) {

                closePreview();

            }

        }
    );


    /* =========================================
       ESC
    ========================================= */

    document.addEventListener(
        "keydown",
        function(e) {

            if (
                e.key === "Escape" &&
                modal.classList.contains("active")
            ) {

                closePreview();

            }

        }
    );


    /* =========================================
   PREVIEW ZOOM + DRAG / PAN
========================================= */

let previewZoom = 1;

let previewX = 0;
let previewY = 0;

let isDragging = false;

let dragStartX = 0;
let dragStartY = 0;

let dragStartTranslateX = 0;
let dragStartTranslateY = 0;


/* =========================================
   PREVENT NATIVE IMAGE DRAG
========================================= */

previewImage.draggable = false;


/* =========================================
   UPDATE IMAGE
========================================= */

function updatePreviewTransform() {

    previewImage.style.transform =
        `translate3d(
            ${previewX}px,
            ${previewY}px,
            0
        ) scale(${previewZoom})`;

    if (previewZoom > 1) {
        previewImage.classList.add("zoomed");
    } else {
        previewImage.classList.remove("zoomed");
        previewImage.classList.remove("is-dragging");
    }
}


/* =========================================
   CALCULATE DRAG LIMIT
========================================= */

function getDragBounds() {

    const modalRect =
        modal.getBoundingClientRect();


    const naturalWidth =
        previewImage.naturalWidth;

    const naturalHeight =
        previewImage.naturalHeight;

    if (!naturalWidth || !naturalHeight) {

        return {
            maxX: 0,
            maxY: 0
        };

    }

    const imageWidth =
        naturalWidth * previewZoom;

    const imageHeight =
        naturalHeight * previewZoom;


    const maxX =
        Math.max(
            0,
            (imageWidth - modalRect.width) / 2
        );

    const maxY =
        Math.max(
            0,
            (imageHeight - modalRect.height) / 2
        );


    return {
        maxX,
        maxY
    };

}


/* =========================================
   LIMIT POSITION
========================================= */

function clampPreviewPosition() {

    const bounds =
        getDragBounds();


    previewX =
        Math.max(
            -bounds.maxX,
            Math.min(
                bounds.maxX,
                previewX
            )
        );


    previewY =
        Math.max(
            -bounds.maxY,
            Math.min(
                bounds.maxY,
                previewY
            )
        );

}


/* =========================================
   RESET VIEW
========================================= */

function resetPreviewView() {

    previewZoom = 1;

    previewX = 0;
    previewY = 0;

    isDragging = false;

    previewImage.classList.remove(
        "is-dragging"
    );

    updatePreviewTransform();

}


/* =========================================
   MOUSE WHEEL ZOOM
========================================= */

previewImage.addEventListener(
    "wheel",
    function(e) {

        e.preventDefault();

        const oldZoom =
            previewZoom;

        const zoomStep = 0.15;


        if (e.deltaY < 0) {

            previewZoom += zoomStep;

        } else {

            previewZoom -= zoomStep;

        }


        /*
         * Zoom limit
         */

        previewZoom =
            Math.max(
                1,
                Math.min(
                    5,
                    previewZoom
                )
            );


        /*
         * If zooming back to 1x,
         * return image to center.
         */

        if (previewZoom === 1) {

            previewX = 0;
            previewY = 0;

        } else {

            clampPreviewPosition();

        }


        updatePreviewTransform();

    },
    {
        passive: false
    }
);


/* =========================================
   START DRAG
========================================= */

previewImage.addEventListener(
    "pointerdown",
    function(e) {

        /*
         * Only allow dragging when zoomed.
         */

        if (previewZoom <= 1) {
            return;
        }


        if (e.button !== 0) {
            return;
        }


        e.preventDefault();


        isDragging = true;


        dragStartX =
            e.clientX;

        dragStartY =
            e.clientY;


        dragStartTranslateX =
            previewX;

        dragStartTranslateY =
            previewY;


        previewImage.classList.add(
            "is-dragging"
        );


        /*
         * Capture pointer.
         *
         * This is important because
         * the mouse can leave the image
         * while dragging.
         */

        previewImage.setPointerCapture(
            e.pointerId
        );

    }
);


/* =========================================
   DRAG IMAGE
========================================= */

previewImage.addEventListener(
    "pointermove",
    function(e) {

        if (!isDragging) {
            return;
        }


        const deltaX =
            e.clientX - dragStartX;

        const deltaY =
            e.clientY - dragStartY;


        previewX =
            dragStartTranslateX +
            deltaX;

        previewY =
            dragStartTranslateY +
            deltaY;


        /*
         * Keep image inside preview area.
         */

        clampPreviewPosition();


        updatePreviewTransform();

    }
);


/* =========================================
   STOP DRAG
========================================= */

previewImage.addEventListener(
    "pointerup",
    function(e) {

        if (!isDragging) {
            return;
        }


        isDragging = false;


        previewImage.classList.remove(
            "is-dragging"
        );


        try {

            previewImage.releasePointerCapture(
                e.pointerId
            );

        } catch(error) {}

    }
);


previewImage.addEventListener(
    "pointercancel",
    function() {

        isDragging = false;

        previewImage.classList.remove(
            "is-dragging"
        );

    }
);


/* =========================================
   DOUBLE CLICK
========================================= */

previewImage.addEventListener(
    "dblclick",
    function(e) {

        e.preventDefault();

        e.stopPropagation();


        if (previewZoom === 1) {

            previewZoom = 2.5;

        } else {

            previewZoom = 1;

            previewX = 0;
            previewY = 0;

        }


        clampPreviewPosition();

        updatePreviewTransform();

    }
);
}
/* =========================================
   SELLING POINT + SPEC REVEAL
========================================= */

function initSectionReveal() {

    const sections = document.querySelectorAll(
        ".selling-points, .spec-section"
    );

    if (!sections.length) return;

    if (!("IntersectionObserver" in window)) {

        sections.forEach(section => {
            section.classList.add("is-visible");
        });

        return;
    }

    const observer = new IntersectionObserver(
        entries => {

            entries.forEach(entry => {

                if (entry.isIntersecting) {

                    entry.target.classList.add("is-visible");

                    observer.unobserve(entry.target);
                }

            });

        },
        {
            threshold: 0.15,
            rootMargin: "0px 0px -40px 0px"
        }
    );

    sections.forEach(section => {
        observer.observe(section);
    });
}
