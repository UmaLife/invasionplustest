<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product2 - LightRays Integration</title>
    <link rel="stylesheet" href="static/BorderGlow.css">
    <script type="importmap">
    {
        "imports": {
            "ogl": "https://cdn.jsdelivr.net/npm/ogl@1.0.11/+esm"
        }
    }
    </script>
</head>
<body>

    <div class="scroll-container" id="scrollBox">
        
        <section class="section-1">
            <div class="text-content">
                <p>Welcome</p>
                <h1>Creative<br>Full-Stack<br>Developer</h1>
            </div>
        </section>

        <section class="section-2" id="s2">
            <div id="light-rays-container" class="light-rays-container"></div>
            
            <div class="text-content">
                <h3 id="titleS2">Optimized for Maximum Airflow</h3>
               <p class="description">
                    Experience peak performance with a chassis designed for high-end cooling. 
                    The E20 series supports up to nine 120mm fans for ultimate thermal control.
                </p>
            </div>

            <div class="image-container" id="photo">
                <img src="static/E20.1.png" alt="Photo">
            </div>
        </section>
                
        <section class="section-3">
            <div class="text-content">
                <h1>Keep Scrolling</h1>
            </div>
        </section>

    </div>

    <script type="module">
        import { Renderer, Program, Triangle, Mesh } from 'ogl';

        class LightRaysNative {
            constructor(container, options = {}) {
                this.container = container;
                this.options = {
                    raysOrigin: options.raysOrigin || 'top-center',
                    raysColor: options.raysColor || '#ffffff',
                    raysSpeed: options.raysSpeed || 1.0,
                    lightSpread: options.lightSpread || 0.5,
                    rayLength: options.rayLength || 3.0,
                    mouseInfluence: options.mouseInfluence || 0.1,
                    ...options
                };
                this.mouse = { x: 0.5, y: 0.5 };
                this.smoothMouse = { x: 0.5, y: 0.5 };
                this.init();
            }

            hexToRgb(hex) {
                const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                return m ? [parseInt(m[1], 16) / 255, parseInt(m[2], 16) / 255, parseInt(m[3], 16) / 255] : [1, 1, 1];
            }

            init() {
                this.renderer = new Renderer({ dpr: Math.min(window.devicePixelRatio, 2), alpha: true });
                this.gl = this.renderer.gl;
                this.container.appendChild(this.gl.canvas);

                const vert = `attribute vec2 position; varying vec2 vUv; void main() { vUv = position * 0.5 + 0.5; gl_Position = vec4(position, 0.0, 1.0); }`;
                const frag = `
                    precision highp float;
                    uniform float iTime, raysSpeed, lightSpread, rayLength, mouseInfluence;
                    uniform vec2 iResolution, rayPos, rayDir, mousePos;
                    uniform vec3 raysColor;
                    float rayStrength(vec2 raySource, vec2 rayRefDirection, vec2 coord, float seedA, float seedB, float speed) {
                        vec2 sourceToCoord = coord - raySource;
                        vec2 dirNorm = normalize(sourceToCoord);
                        float cosAngle = dot(dirNorm, rayRefDirection);
                        float spreadFactor = pow(max(cosAngle, 0.0), 1.0 / max(lightSpread, 0.001));
                        float dist = length(sourceToCoord);
                        float falloff = clamp((iResolution.x * rayLength - dist) / (iResolution.x * rayLength), 0.0, 1.0);
                        float base = clamp((0.45 + 0.15 * sin(cosAngle * seedA + iTime * speed)) + (0.3 + 0.2 * cos(-cosAngle * seedB + iTime * speed)), 0.0, 1.0);
                        return base * falloff * spreadFactor;
                    }
                    void main() {
                        vec2 coord = vec2(gl_FragCoord.x, iResolution.y - gl_FragCoord.y);
                        vec2 finalRayDir = rayDir;
                        if (mouseInfluence > 0.0) {
                            finalRayDir = normalize(mix(rayDir, normalize((mousePos * iResolution.xy) - rayPos), mouseInfluence));
                        }
                        float r1 = rayStrength(rayPos, finalRayDir, coord, 36.2214, 21.11349, 1.5 * raysSpeed);
                        float r2 = rayStrength(rayPos, finalRayDir, coord, 22.3991, 18.0234, 1.1 * raysSpeed);
                        gl_FragColor = vec4(raysColor, (r1 * 0.5 + r2 * 0.4) * 0.8);
                    }
                `;

                this.uniforms = {
                    iTime: { value: 0 },
                    iResolution: { value: [0, 0] },
                    rayPos: { value: [0, 0] },
                    rayDir: { value: [0, 1] },
                    raysColor: { value: this.hexToRgb(this.options.raysColor) },
                    raysSpeed: { value: this.options.raysSpeed },
                    lightSpread: { value: this.options.lightSpread },
                    rayLength: { value: this.options.rayLength },
                    mousePos: { value: [0.5, 0.5] },
                    mouseInfluence: { value: this.options.mouseInfluence }
                };

                this.program = new Program(this.gl, { vertex: vert, fragment: frag, uniforms: this.uniforms, transparent: true });
                this.mesh = new Mesh(this.gl, { geometry: new Triangle(this.gl), program: this.program });

                window.addEventListener('resize', () => this.resize());
                window.addEventListener('mousemove', (e) => {
                    const rect = this.container.getBoundingClientRect();
                    this.mouse.x = (e.clientX - rect.left) / rect.width;
                    this.mouse.y = (e.clientY - rect.top) / rect.height;
                });

                this.resize();
                requestAnimationFrame((t) => this.render(t));
            }

            resize() {
                const w = this.container.clientWidth;
                const h = this.container.clientHeight;
                this.renderer.setSize(w, h);
                this.uniforms.iResolution.value = [w * this.renderer.dpr, h * this.renderer.dpr];
                this.uniforms.rayPos.value = [w * this.renderer.dpr * 0.5, -h * this.renderer.dpr * 0.2];
            }

            render(t) {
                this.uniforms.iTime.value = t * 0.001;
                this.smoothMouse.x += (this.mouse.x - this.smoothMouse.x) * 0.08;
                this.smoothMouse.y += (this.mouse.y - this.smoothMouse.y) * 0.08;
                this.uniforms.mousePos.value = [this.smoothMouse.x, this.smoothMouse.y];
                this.renderer.render({ scene: this.mesh });
                requestAnimationFrame((t) => this.render(t));
            }
        }

        //lightray
        const raysContainer = document.getElementById('light-rays-container');
        const raysEffect = new LightRaysNative(raysContainer, {
            raysColor: "#ffffff",
            lightSpread: 0.6
        });

        // picture move
        scrollBox.addEventListener('scroll', () => {
    const scrollTop = scrollBox.scrollTop;
    const vh = window.innerHeight;
    const vw = window.innerWidth;

    let progress = scrollTop / vh;
    let p = Math.max(0, Math.min(1, progress));

  
    photo.style.opacity = p;
    const scale = 0.35 + (p * 0.4); 
    const slideEffect = (1 - p) * 450; 
    const extraDown = p * 120; 
    photo.style.transform = `translate(calc(50% + ${slideEffect}px), calc(-50% + ${extraDown}px)) scale(${scale})`;

    // --- SUCCESSION TEXT ANIMATION ---
    const titleS2 = document.getElementById('titleS2');
    const description = document.querySelector('.description');

    if (titleS2) {
        // 1. Fade in
        titleS2.style.opacity = p;
        
        // 2. Subtle upward drift: starts 30px down, moves to 0
        const drift = (1 - p) * 30;
        titleS2.style.transform = `translateY(${drift}px)`;
        
        // 3. Dynamic letter spacing: starts tight, expands slightly
        // Succession titles often feel like they are "breathing"
        titleS2.style.letterSpacing = `${0.1 + (p * 0.2)}em`;
    }

    if (description) {
        // Delay the description slightly by squaring the progress or using a threshold
        const descP = Math.max(0, (p - 0.2) / 0.8); 
        description.style.opacity = descP;
        description.style.transform = `translateY(${(1 - descP) * 20}px)`;
    }
});
    </script>
</body>
</html>
