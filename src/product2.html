<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product2 - LightRays Integration</title>
    <link rel="stylesheet" href="static/BorderGlow.css">
    <script type="importmap">
    {
        "imports": {
            "ogl": "https://cdn.jsdelivr.net/npm/ogl@1.0.11/+esm"
        }
    }
    </script>
</head>
<body>

    <div class="scroll-container" id="scrollBox">
        <section class="section-1">
            <div class="text-content">
                <p>Welcome</p>
                <h1>Creative<br>Full-Stack<br>Developer</h1>
            </div>
        </section>

        <section class="section-2" id="s2">
            <div id="light-rays-container" class="light-rays-container" style="width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1;"></div>
            
            <div class="text-content" style="position: relative; z-index: 2;">
                <h3 id="titleS2">Optimized for Maximum Airflow</h3>
                <p class="description">
                    Experience peak performance with a chassis designed for high-end cooling. 
                </p>
            </div>

            <div class="image-container" id="photo" style="position: relative; z-index: 2;">
                <img src="static/E20.1.png" alt="Photo">
            </div>
        </section>

        <section class="section-3" id="s3">
        <p>ddd</p></section>
    </div>

    <script type="module">
        // Direct relative import is usually safer for local files
        import { LightRaysNative } from './lightray.js';

        // Initialize Light Rays
        const raysContainer = document.getElementById('light-rays-container');
        if (raysContainer) {
            new LightRaysNative(raysContainer, {
                raysColor: "#ffffff",
                lightSpread: 0.6
            });
        }

        // Scroll Logic
        const scrollBox = document.getElementById('scrollBox');
        const photo = document.getElementById('photo');
        const titleS2 = document.getElementById('titleS2');

       scrollBox.addEventListener('scroll', () => {
    const scrollTop = scrollBox.scrollTop;
    const vh = window.innerHeight;
    const vw = window.innerWidth;

    let progress = scrollTop / vh;
    let p = Math.max(0, Math.min(1, progress));

  
    photo.style.opacity = p;
    const scale = 0.35 + (p * 0.4); 
    const slideEffect = (1 - p) * 450; 
    const extraDown = p * -80; 
    photo.style.transform = `translate(calc(117% + ${slideEffect}px), calc(-50% + ${extraDown}px)) scale(${scale})`;

    // --- SUCCESSION TEXT ANIMATION ---
    const titleS2 = document.getElementById('titleS2');
    const description = document.querySelector('.description');

    if (titleS2) {
        // 1. Fade in
        titleS2.style.opacity = p;
        
        // 2. Subtle upward drift: starts 30px down, moves to 0
        const drift = (1 - p) * 30;
        titleS2.style.transform = `translateY(${drift}px)`;
        
        // 3. Dynamic letter spacing: starts tight, expands slightly
        // Succession titles often feel like they are "breathing"
        titleS2.style.letterSpacing = `${0.1 + (p * 0.2)}em`;
    }

    if (description) {
        // Delay the description slightly by squaring the progress or using a threshold
        const descP = Math.max(0, (p - 0.2) / 0.8); 
        description.style.opacity = descP;
        description.style.transform = `translateY(${(1 - descP) * 20}px)`;
    }
});
    </script>
</body>
</html>
