    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
        <link rel="stylesheet" href="static/style.css">
        <link rel="stylesheet" href="static/css/xqz-description.css">
        <link rel="stylesheet" href="static/cooler.css">
        <link href="https://fonts.googleapis.com/css?family=DM+Sans" rel="stylesheet">
        <title>InvasionPlus</title>

    </head>
   <body class="allproduct-page">

    <!--Product type-->
    <section class="category-hero">

        <div class="hero-left">

            <p class="breadcrumb">
                Home / <span>Monitors</span>
            </p>

            <h1>MONITORS</h1>

            <p class="hero-description">
                Experience stunning visuals and ultra-smooth gameplay with monitors built for gamers, creators and professionals.
            </p>


            <div class="hero-features">

                <div class="feature">
                    <i class="fa-regular fa-eye"></i>

                    <div>
                        <h4>IMMERSIVE VISUALS</h4>
                        <p>Crystal clear image quality.</p>
                    </div>
                </div>

                <div class="feature">
                    <i class="fa-solid fa-bolt"></i>

                    <div>
                        <h4>HIGH REFRESH</h4>
                        <p>Ultra smooth gameplay.</p>
                    </div>
                </div>

                <div class="feature">
                    <i class="fa-solid fa-shield-halved"></i>

                    <div>
                        <h4>PREMIUM BUILD</h4>
                        <p>Designed to last.</p>
                    </div>
                </div>

            </div>

        </div>

        <div class="hero-right">
            <img src="static/hero_monitor.png" alt="Monitor Hero">
        </div>

    </section>

    <!---Product-->
        <div id="productArea" class="product-area">
            
            <!--buttons-->
            <div id="filtersArea" class="filters">

                <div class="filters-left">
                    <button class="filter-toggle" onclick="toggleFilterPanel()">
                        Filter by <i class="fa-solid fa-chevron-down"></i>
                    </button>

                    <button class="clear-btn" onclick="clearFilters()">
                        Clear
                    </button>
                    
                        <div class="filter-panel" id="filterPanel">

                            <button class="close-btn filter-close" onclick="toggleFilterPanel()">
                                <i class="fa-solid fa-xmark"></i>
                            </button>

                            <div class="filter-group">
                                <h4>Colour</h4>
                                <div id="colorFilters"></div>
                            </div>

                            <div class="filter-group">
                                <h4>Monitor Type</h4>
                                <div id="typeFilters"></div>
                            </div>

                            <div class="filter-group">
                                <h4>Screen Size</h4>
                                <div id="sizeFilters"></div>
                            </div>

                        </div>
                </div>

        </div>

            <div class="product-container">
                <div class="product-list" id="monitor-product-list">
                </div>
            </div>
        </section>


    <script type="module" src="home.js"></script>
    <script src="set.js">
    </script>
    <script>
    let allProducts = [];
    let filteredProducts = [];

    let filters = {
        colors: [],
        types: [],
        sizes: []
    };

    async function loadMonitorProducts() {
        const response = await fetch("products.json");
        const data = await response.json();

        allProducts = data.products.filter(p => p.category === "monitor");

        filteredProducts = [...allProducts];

        displayProducts(filteredProducts);
        initFilterOptions();
    }

    function displayProducts(products) {

        const productList = document.getElementById("monitor-product-list");

        productList.innerHTML = "";

        if (!products || products.length === 0) {
            productList.innerHTML = `<p style="color:#aaa;">No products found</p>`;
            return;
        }

           products.forEach((product, index) => {
        const image =
            product.mainImage ||
            product.images?.[0] ||
            product.variations?.black?.[0] ||
            "static/fallback.png";

        const variations = product.variations
            ? Object.keys(product.variations).join("/")
            : "Black";

        productList.innerHTML += `
            <article 
                onclick="window.location.href='product2.html?id=${product.id}'" 
                class="product"
                style="transition-delay:${(index % 4) * 0.15}s;"
            >

                    <img src="${image}">

                  <div class="product-name">
    <h3>${product.name}</h3>

    <p>
        Category:
        ${product["product-type"] || "N/A"}
    </p>

    <p>
        Variation:
        ${variations}
    </p>

    <div class="price-divider"></div>

    <a href="product2.html?id=${product.id}"
       class="product-learn-more"
       onclick="event.stopPropagation()">
        Learn More →
    </a>
</div>

                </article>
            `;
        });

        observeProducts();
    }
    
    function filterProducts(type) {

        // RESET all filters first (important)
        filters.types = [];
        filters.colors = [];
        filters.sizes = [];

        // if "All" → show everything
        if (type === "All") {
            filteredProducts = [...allProducts];
            displayProducts(filteredProducts);
            return;
        }

        // apply type filter only
        filters.types = [type];

        applyFilters();

        document.getElementById("filtersArea").scrollIntoView({
            behavior: "smooth"
        });
    }

    function applyFilters() {

        const result = allProducts.filter(p => {

            // TYPE
            if (filters.types.length > 0) {
                if (!filters.types.includes(p["product-type"])) return false;
            }

            // COLOR
            if (filters.colors.length > 0) {
                const colors = Object.keys(p.variations || {});
                if (!filters.colors.some(c => colors.includes(c))) return false;
            }

            // SCREEN SIZE
            if (filters.sizes.length > 0) {
                if (!filters.sizes.includes((p.screenSize || p.size || p.specs?.["Screen Size"]))) return false;
            }

            return true;
        });

        filteredProducts = result;
        displayProducts(result);
    }

    function toggle(arr, value) {
        const i = arr.indexOf(value);
        if (i > -1) arr.splice(i, 1);
        else arr.push(value);
    }

    function toggleColor(v) {
        toggle(filters.colors, v);
        applyFilters();
    }

    function toggleType(v) {
        toggle(filters.types, v);
        applyFilters();
    }

    function toggleSize(v) {
        toggle(filters.sizes, v);
        applyFilters();
    }

    function initFilterOptions() {

        buildColors();
        buildTypes();
        buildSizes();
    }

    function buildColors() {
        const el = document.getElementById("colorFilters");
        const set = new Set();

        allProducts.forEach(p => {
            Object.keys(p.variations || {}).forEach(c => set.add(c));
        });

        el.innerHTML = [...set].map(c => `
            <label class="filter-option">
                <input type="checkbox" onchange="toggleColor('${c}')">
                ${c}
            </label>
        `).join("");
    }

    function buildTypes() {
        const el = document.getElementById("typeFilters");
        const set = new Set();

        allProducts.forEach(p => {
            if (p["product-type"]) set.add(p["product-type"]);
        });

        el.innerHTML = [...set].map(t => `
            <label class="filter-option">
                <input type="checkbox" onchange="toggleType('${t}')">
                ${t}
            </label>
        `).join("");
    }

    /* SCREEN SIZES */
    function buildSizes() {
        const el = document.getElementById("sizeFilters");
        const set = new Set();

        allProducts.forEach(p => {
            const size = p.screenSize || p.size || p.specs?.["Screen Size"];
            if (size) set.add(size);
        });

        el.innerHTML = [...set].map(f => `
            <label class="filter-option">
                <input type="checkbox" onchange="toggleSize('${f}')">
                ${f}
            </label>
        `).join("");
    }

    function toggleFilterPanel() {
        const panel = document.getElementById("filterPanel");
        panel.classList.toggle("active");
    }

    function clearFilters() {

        filters = {
            colors: [],
            types: [],
            sizes: []
        };

        document.querySelectorAll("input[type=checkbox]")
            .forEach(c => c.checked = false);

        displayProducts(allProducts);
    }

    /* =========================
    ANIMATION
    ========================= */
    function observeProducts() {

        const products = document.querySelectorAll(".product");

        const observer = new IntersectionObserver((entries) => {

            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add("show");
                }
            });

        }, { threshold: 0.2 });

        products.forEach(p => observer.observe(p));
    }

    /* =========================
    INIT
    ========================= */
    document.addEventListener("DOMContentLoaded", () => {
        loadMonitorProducts();
    });
    </script>
    </body>
    </html>
