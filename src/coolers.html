<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="static/style.css">
    <link rel="stylesheet" href="static/cooler.css">
    <link href="https://fonts.googleapis.com/css?family=DM+Sans" rel="stylesheet">
    <title>InvasionPlus</title>

</head>
<body>
<!---Overlay Search-->
    <div id="searchOverlay" class="search-overlay">
        <div class="search-box">
            <input type="text" placeholder="Search your product" autofocus>
            <i class="fa-solid fa-xmark close-btn" onclick="closeSearch()"></i>
        </div>
    </div>
<!--Menu bar-->
    <div class="side-menu" id="sideMenu">
        <div class="menu-content">
        <h2>MENU</h2>
        <div class="menu-search">
            <input type="text" placeholder="Search your product">
        </div>
        <ul>
            <li onclick="openProductPanel()">Product</li>
            <li onclick="closeProductPanel()">Software</li>
            <li onclick="closeProductPanel()">Contact</li>
            <li onclick="closeProductPanel()">About Us</li>
        </ul>
        <div class="menu-logo">
            <img src="static/logo.png"alt="logo">
        </div>
        <i class="fa-solid fa-xmark menu-close" onclick="closeMenu()"></i>
        </div>
    </div>
    <div class="product-panel" id="productPanel">
        <div class="panel-content">
        <a href="cases.html" class="product-item">
            <img src="static/cases.png">
            <span>Cases</span>
        </a>
        <a href="cooling.html" class="product-item">
            <img src="static/cooling.png">
            <span>Cooling</span>
        </a>
        <a href="monitor.html" class="product-item">
            <img src="static/monitor.png">
            <span>Monitor</span>
        </a>

    </div>
    </div>
    <div class="homepage" id="homepage">

    </div>

<!--Product type-->
<section class="cases">
    <div class="category-container">
        <h3 class="breadcrumb">Home/Coolers</h3>
        <h2 class="product-type">Coolers</h2>
        <p class="category-subtitle">
            Unlock maximum performance with cooling solutions designed for gamers and creators.
        </p>

        <div class="type-list">


            <a href="#" class="type-card-link" onclick="filterProducts('ATX'); return false;">
                <article class="card">
                    <img src="static/liquid-cooler.png" alt="liquid-cooler">
                    <div class="type-name">
                        <h3>AIO Cooler</h3>
                    </div>
                </article>
            </a>

            <a href="#" class="type-card-link" onclick="filterProducts('M-ATX'); return false;">                
                <article class="card">
                    <img src="static/cpu-fan.png" alt="cpu-cooler">
                    <div class="type-name">
                        <h3>CPU Cooler</h3>
                    </div>
                </article>
            </a>

            <a href="#" class="type-card-link" onclick="filterProducts('M-ATX'); return false;">                
                <article class="card">
                    <img src="static/pc-fan.png" alt="pc-fan">
                    <div class="type-name">
                        <h3>PC Fans</h3>
                    </div>
                </article>
            </a>

        </div>
        <div class="divider" id="filtersArea"></div>
    </section>

<!---Product-->
    <div id="productArea" class="product-area">
        
        <!--buttons-->
        <div class="filters">

            <div class="filters-left">
                <button class="filter-toggle" onclick="toggleFilterPanel()">
                    Filter by <i class="fa-solid fa-chevron-down"></i>
                </button>
                
                <div class="filter-panel" id="filterPanel">

                    <button class="close-btn filter-close" onclick="toggleFilterPanel()">
                        <i class="fa-solid fa-xmark"></i>
                    </button>

                    <div class="filter-group">
                        <h4>Colour</h4>
                        <div id="colorFilters"></div>
                    </div>

                    <div class="filter-group">
                        <h4>Motherboard Support</h4>
                        <div id="motherboardFilters"></div>
                    </div>

                    <div class="filter-group">
                        <h4>PCIe Slots</h4>
                        <div id="pcieFilters"></div>
                    </div>

                    <div class="filter-group">
                        <h4>Fans</h4>
                        <div id="fanFilters"></div>
                    </div>
                </div>
        </div>

            <div class="sorting">
                <h3>Sort by:</h3>
                <select id="sortFilter">
                    <option value="newest">Newest First</option>
                    <option value="low-high">Price Low to High</option>
                    <option value="high-low">Price High to Low</option>
                </select>
            </div>
    </div>

        <div class="product-container">
            <div class="product-list" id="cooling-product-list">
            </div>
        </div>
    </section>


<script type="module" src="home.js"></script>
<script src="set.js">
</script>
<script>
let allProducts = [];

// Load cooling products
async function loadCoolingProducts() {
    const response = await fetch("products.json");
    const data = await response.json();

    allProducts = data.products.filter(
        product => product.category === "cooler"
    );

    displayProducts(allProducts);
}

// Display products
function displayProducts(products) {

    const productList = document.getElementById("cooling-product-list");

    productList.innerHTML = "";

    if(products.length === 0){
        productList.innerHTML = `
            <p style="color:#aaa; grid-column:1/-1;">
                No cooling products found.
            </p>
        `;
        return;
    }

    products.forEach(product => {

        const image =
            product.mainImage ||
            product.images?.[0] ||
            product.variations?.black?.[0] ||
            "static/fallback.png";

        const variations = product.variations
            ? Object.keys(product.variations).join("/")
            : "Black";

        productList.innerHTML += `
            <article
                onclick="window.location.href='product2.html?id=${product.id}'"
                class="product">

                <img src="${image}" alt="${product.name}">

                <div class="product-name">
                    <h3>${product.name}</h3>

                    <p>Category: ${product["product-type"] || "N/A"}</p>
                    <p>Variation: ${variations}</p>

                    <span class="price">${product.price}</span>

                    <div class="price-divider"></div>

                    <a href="product2.html?id=${product.id}"
                       class="product-learn-more"
                       onclick="event.stopPropagation()">
                        Learn More →
                    </a>
                </div>

            </article>
        `;
    });

    observeProducts();
}

// Product animation
function observeProducts(){

    const products = document.querySelectorAll(".product");

    const observer = new IntersectionObserver((entries) => {

        entries.forEach(entry => {

            if(entry.isIntersecting){
                entry.target.classList.add("show");
            }

        });

    }, {
        threshold: 0.2
    });

    products.forEach(product => {
        observer.observe(product);
    });
}

// Filter panel animation (optional)
function toggleFilterPanel() {

    const panel = document.getElementById("filterPanel");
    const button = document.querySelector(".filter-toggle");

    panel.classList.toggle("active");
    button.classList.toggle("active");
}

// Start
document.addEventListener("DOMContentLoaded", () => {
    loadCoolingProducts();
});

</script>
</body>
</html>
