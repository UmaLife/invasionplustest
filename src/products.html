<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="static/style.css">
    <link rel="stylesheet" href="static/products.css">
    <link href="https://fonts.googleapis.com/css?family=DM+Sans" rel="stylesheet">
    <title>InvasionPlus</title>

</head>
<body>

        <div class="category-container">

            <h3 class="breadcrumb">Home / Search</h3>

            <h3 class="search-label">SEARCH RESULTS</h3>

            <h2 class="product-type" id="searchTitle"></h2>

            <div class="search-meta">
                <span id="resultCount"></span>
            </div>

            <p class="category-subtitle">
                Discover products matching your search.
            </p>

            <div class="sorting">
                <h3>Sort by:</h3>
                <select id="sortFilter">
                    <option value="newest">Newest First</option>
                    <option value="low-high">Price Low to High</option>
                    <option value="high-low">Price High to Low</option>
                </select>
            </div>

            <div class="divider"></div>

        </div>

    <!-- Products -->
    <div class="product-area">

        <div class="product-container">

            <div class="product-list" id="searchResults">

            </div>

        </div>

    </div>


<script type="module" src="home.js"></script>
<script src="set.js"></script>
<script>
let allProducts = [];
let filteredProducts = [];

async function loadSearchResults(){

    const response = await fetch("products.json");
    const data = await response.json();

    allProducts = data.products;

    const keyword =
        localStorage.getItem("searchKeyword") || "";

    document.getElementById("searchTitle").innerHTML =
        `${keyword}`;

    filteredProducts = allProducts.filter(product => {

        const name =
            (product.name || "").toLowerCase();

        const category =
            (product.category || "").toLowerCase();

        const type =
            (product["product-type"] || "").toLowerCase();

        const search =
            keyword.toLowerCase();

        return (
            name.includes(search) ||
            category.includes(search) ||
            type.includes(search)
        );
    });

    document.getElementById("searchTitle").textContent =
    keyword.charAt(0).toUpperCase() +
    keyword.slice(1);

    document.getElementById("resultCount").textContent =
    `${filteredProducts.length} Products Found`;

    renderProducts(filteredProducts);
}

function renderProducts(products){

    const container =
        document.getElementById("searchResults");

    if(products.length === 0){

        container.innerHTML = `
            <div class="no-results">
                <h3>No Products Found</h3>
                <p>Try another keyword.</p>
            </div>
        `;

        return;
    }

    container.innerHTML = products.map(product => {

        const image =
            product.mainImage ||
            product.images?.[0] ||
            product.variations?.black?.[0] ||
            "static/fallback.png";

        const variations =
            product.variations
                ? Object.keys(product.variations).join("/")
                : "Black";

        return `

            <article
                onclick="window.location.href='product2.html?id=${product.id}'"
                class="product">

                <img src="${image}" alt="${product.name}">

                <div class="product-name">

                    <h3>${product.name}</h3>

                    <p>
                        Category:
                        ${product["product-type"] || "N/A"}
                    </p>

                    <p>
                        Variation:
                        ${variations}
                    </p>

                    ${product.price ? `
                        <span class="price">
                            ${product.price}
                        </span>

                        <div class="price-divider"></div>
                    ` : ""}

                    <a href="product2.html?id=${product.id}"
                        class="product-learn-more"
                        onclick="event.stopPropagation()">

                        Learn More →

                    </a>

                </div>

            </article>

        `;
    }).join("");

    observeProducts();
}

function observeProducts(){

    const products =
        document.querySelectorAll(".product");

    const observer =
        new IntersectionObserver((entries)=>{

        entries.forEach(entry=>{

            if(entry.isIntersecting){
                entry.target.classList.add("show");
            }

        });

    }, {
        threshold: 0.2
    });

    products.forEach(product=>{
        observer.observe(product);
    });
}

function getPriceNumber(priceText) {
    const match = priceText.match(/\d+(\.\d+)?/);
    return match ? parseFloat(match[0]) : 0;
}

function sortProducts() {

    const sortValue =
        document.getElementById("sortFilter").value;

    let sortedProducts = [...filteredProducts];

    if (sortValue === "low-high") {
        sortedProducts.sort((a, b) =>
            getPriceNumber(a.price) -
            getPriceNumber(b.price)
        );
    }

    if (sortValue === "high-low") {
        sortedProducts.sort((a, b) =>
            getPriceNumber(b.price) -
            getPriceNumber(a.price)
        );
    }

    renderProducts(sortedProducts);
}

document.addEventListener("DOMContentLoaded", () => {

    loadSearchResults();

    const sortFilter =
        document.getElementById("sortFilter");

    if(sortFilter){
        sortFilter.addEventListener(
            "change",
            sortProducts
        );
    }

});

</script>
</body>
</html>
